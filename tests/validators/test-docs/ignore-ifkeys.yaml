
test-1:
  transformers:
    - ValueTransformer
  input:
    correct-str: YES!
    incorrect-str: NO!
    a-string:
      hell
    correct-output:
      ))a-string, ))correct-str
    incorrect-output:
      ))a-string, ))incorrect-str
